<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<head>
    <title>Finale Project</title>
    
    <style>
        .banner{
            width: 450px;
            height: 50px;
            background-color: palevioletred;
            margin: auto;
        }
        .game-box {
            width: 1000px;
            height: 1000px;
            color: rgb(210, 88, 226);
            background-color: white;
            padding: 20px;
            border: 5px solid indigo;
            border-radius: 5px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .inner-box{
            width: 500px;
            height: 350px;
            color: rgb(210, 88, 226);
            background-color: white;
            padding: 20px;
            border: 5px solid rgb(155, 92, 201);
            border-radius: 10px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .Game-title{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            color: black;
            text-align: center;
        }
        .members{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            color: palevioletred;
            text-align: center;
        }
        .class{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            color: black;
            text-align: center;
        }
        .date{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            color: black;
            text-align: center;
        }
        .the-game-title{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            color: black;
            text-align: center;
        }
        .instruction-link{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            color: black;
            text-align: center;

        }
        
        
    </style>

</head>

<body>
    <div class="game-box">
        <div class="inner-box">
            
            <div class="banner"></div>
        <div class="Game-title">
            <h1>Tic-Tac-Toe</h1>
        </div>
        <div class="members">
            <p>Members: 13 30 1</p>
        </div>
        <div class="class">
            <h4>M.3/1</h4>
        </div>
        <div class="date">
            <p>7/9/2026</p>
        </div>


        </div>
        <div class="the-game-texts">
            <div class="the-game-title">
                <h2>The Game</h2>
            </div>
            <div class="instruction-link">
                <h4>Instructions: You can learn and read about how to play This Tic-Tac-Toe Game in the link below.</h4>
                <a href="https://www.wikihow.com/Play-Tic-Tac-Toe" target="_blank">Click here to learn how to play Tic-Tac-Toe</a>
            </div>
        
        



        </div>
        <div class="The-Game">

        </div>

    <main class="background">
        <section class="display">
            player <span class="display-player">X</span>'s turn
        </section>
        <section class="container">
            <div class="a"></div>
            <div class="a"></div>
            <div class="a"></div>
            <div class="a"></div>
            <div class="a"></div>
            <div class="a"></div>
            <div class="a"></div>
            <div class="a"></div>
        </section>
        <section class="display announcer hide"></section>
        <section class="controls">
            <button class="reset">Reset</button>




    </main>

        



    </div>

</body>

</html>
